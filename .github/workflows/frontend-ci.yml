name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    name: Test, Typecheck, Contract and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Vitest
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          npm run test:ci 2>&1 | tee artifacts/logs/vitest.log

      - name: Run TypeScript typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee artifacts/logs/typecheck.log

      - name: Verify pinned OpenAPI contract
        shell: bash
        run: |
          set -o pipefail
          npm run sync-api:check 2>&1 | tee artifacts/logs/openapi-contract.log

      - name: Build production bundle
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee artifacts/logs/build.log

      - name: Upload frontend verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            dist/
          if-no-files-found: warn
          retention-days: 14
