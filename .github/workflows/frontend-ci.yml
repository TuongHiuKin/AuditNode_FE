name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    name: Test, Typecheck, Contract and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Vitest with coverage
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          npm run test:coverage 2>&1 | tee artifacts/logs/vitest.log

      - name: Verify frontend coverage artifacts
        shell: bash
        run: |
          test -s coverage/lcov.info
          test -s coverage/coverage-summary.json

      - name: Run TypeScript typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee artifacts/logs/typecheck.log

      - name: Verify pinned OpenAPI contract
        shell: bash
        run: |
          set -o pipefail
          npm run sync-api:check 2>&1 | tee artifacts/logs/openapi-contract.log

      - name: Build production bundle
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee artifacts/logs/build.log

      - name: Verify Sonar configuration
        if: vars.SONAR_ENABLED == 'true'
        shell: bash
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_HOST_URL"
          test -n "$SONAR_PROJECT_KEY"
          test -n "$SONAR_TOKEN"

      - name: Analyze frontend with SonarQube Server
        if: vars.SONAR_ENABLED == 'true' && vars.SONAR_ORGANIZATION == ''
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true

      - name: Analyze frontend with SonarCloud
        if: vars.SONAR_ENABLED == 'true' && vars.SONAR_ORGANIZATION != ''
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true

      - name: Upload frontend verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            coverage/
            dist/
          if-no-files-found: warn
          retention-days: 14
