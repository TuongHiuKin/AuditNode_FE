name: auditnode-e2e

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${E2E_POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: auditnode_e2e
      POSTGRES_USER: ${E2E_DB_USERNAME:?set E2E_DB_USERNAME}
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?set E2E_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrations:
    build:
      context: ../../../AuditNode.Backend
    command: ["dotnet", "AuditNode.API.dll", "--migrate-only"]
    environment: &backend-environment
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=auditnode_e2e;Username=${E2E_DB_USERNAME:?set E2E_DB_USERNAME};Password=${E2E_DB_PASSWORD:?set E2E_DB_PASSWORD}
      # Access tokens are signed by this API; the E2E stack uses a throwaway key.
      Identity__Issuer: auditnode-e2e
      Identity__Audience: auditnode-api
      Identity__SigningKey: ${E2E_IDENTITY_SIGNING_KEY:?set E2E_IDENTITY_SIGNING_KEY}
      # First-run administrator; the API creates it once the schema exists.
      Identity__BootstrapAdmin__Username: ${E2E_SYSTEM_ADMIN_USERNAME:?set E2E_SYSTEM_ADMIN_USERNAME}
      Identity__BootstrapAdmin__Email: ${E2E_SYSTEM_ADMIN_USERNAME:?set E2E_SYSTEM_ADMIN_USERNAME}@auditnode.local
      Identity__BootstrapAdmin__Password: ${E2E_SYSTEM_ADMIN_PASSWORD:?set E2E_SYSTEM_ADMIN_PASSWORD}
      Cors__AllowedOrigins__0: http://localhost:${E2E_FRONTEND_PORT:-15173}
      # The suite signs in as six actors from one address; keep the app default everywhere else.
      RateLimiting__AuthPermitLimit: 500
    depends_on:
      postgres:
        condition: service_healthy

  schema-views:
    image: postgres:17-alpine
    command:
      - psql
      - --set=ON_ERROR_STOP=1
      - --host=postgres
      - --username=${E2E_DB_USERNAME:?set E2E_DB_USERNAME}
      - --dbname=auditnode_e2e
      - --command=SELECT 1 FROM v_topology_map LIMIT 0; SELECT 1 FROM v_dependency_graph LIMIT 0;
    environment:
      PGPASSWORD: ${E2E_DB_PASSWORD:?set E2E_DB_PASSWORD}
    depends_on:
      migrations:
        condition: service_completed_successfully

  backend:
    build:
      context: ../../../AuditNode.Backend
    environment: *backend-environment
    ports:
      - "127.0.0.1:${E2E_BACKEND_PORT:-15000}:5000"
    depends_on:
      schema-views:
        condition: service_completed_successfully

  backend-ready:
    image: curlimages/curl:8.12.1
    command: ["--fail", "--silent", "--show-error", "--retry", "30", "--retry-all-errors", "--retry-delay", "2", "http://backend:5000/health/ready"]
    depends_on:
      backend:
        condition: service_started

  backend-peer:
    build:
      context: ../../../AuditNode.Backend
    environment: *backend-environment
    ports:
      - "127.0.0.1:${E2E_BACKEND_PEER_PORT:-15001}:5000"
    depends_on:
      schema-views:
        condition: service_completed_successfully

  backend-peer-ready:
    image: curlimages/curl:8.12.1
    command: ["--fail", "--silent", "--show-error", "--retry", "30", "--retry-all-errors", "--retry-delay", "2", "http://backend-peer:5000/health/ready"]
    depends_on:
      backend-peer:
        condition: service_started

  app-bootstrap:
    image: node:20-alpine
    working_dir: /bootstrap
    command: ["node", "bootstrap-app.mjs"]
    volumes:
      - ./bootstrap-app.mjs:/bootstrap/bootstrap-app.mjs:ro
    environment:
      E2E_BACKEND_INTERNAL_URL: http://backend:5000
      E2E_SYSTEM_ADMIN_USERNAME: ${E2E_SYSTEM_ADMIN_USERNAME:?set E2E_SYSTEM_ADMIN_USERNAME}
      E2E_SYSTEM_ADMIN_PASSWORD: ${E2E_SYSTEM_ADMIN_PASSWORD:?set E2E_SYSTEM_ADMIN_PASSWORD}
      E2E_OWNER_USERNAME: ${E2E_OWNER_USERNAME:?set E2E_OWNER_USERNAME}
      E2E_OWNER_PASSWORD: ${E2E_OWNER_PASSWORD:?set E2E_OWNER_PASSWORD}
      E2E_WORKSPACE_ADMIN_USERNAME: ${E2E_WORKSPACE_ADMIN_USERNAME:?set E2E_WORKSPACE_ADMIN_USERNAME}
      E2E_WORKSPACE_ADMIN_PASSWORD: ${E2E_WORKSPACE_ADMIN_PASSWORD:?set E2E_WORKSPACE_ADMIN_PASSWORD}
      E2E_LABEL_AUDITOR_USERNAME: ${E2E_LABEL_AUDITOR_USERNAME:?set E2E_LABEL_AUDITOR_USERNAME}
      E2E_LABEL_AUDITOR_PASSWORD: ${E2E_LABEL_AUDITOR_PASSWORD:?set E2E_LABEL_AUDITOR_PASSWORD}
      E2E_FRAME_AUDITOR_USERNAME: ${E2E_FRAME_AUDITOR_USERNAME:?set E2E_FRAME_AUDITOR_USERNAME}
      E2E_FRAME_AUDITOR_PASSWORD: ${E2E_FRAME_AUDITOR_PASSWORD:?set E2E_FRAME_AUDITOR_PASSWORD}
      E2E_VIEWER_USERNAME: ${E2E_VIEWER_USERNAME:?set E2E_VIEWER_USERNAME}
      E2E_VIEWER_PASSWORD: ${E2E_VIEWER_PASSWORD:?set E2E_VIEWER_PASSWORD}
    depends_on:
      backend-ready:
        condition: service_completed_successfully

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_BASE_URL: /
      VITE_DEV_PROXY_TARGET: http://backend:5000
    volumes:
      - ../..:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:${E2E_FRONTEND_PORT:-15173}:5173"
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully

  frontend-ready:
    image: curlimages/curl:8.12.1
    command: ["--fail", "--silent", "--show-error", "--retry", "30", "--retry-all-errors", "--retry-delay", "2", "http://frontend:5173"]
    depends_on:
      frontend:
        condition: service_started

  playwright:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    profiles: ["test"]
    working_dir: /app
    command: ["sh", "-c", "npm ci && if [ \"$$E2E_CAPTURE_OPENAPI\" = \"1\" ]; then npm run capture-openapi; fi && npm run test:e2e -- --project=fullstack"]
    volumes:
      - ../..:/app
      - playwright-node-modules:/app/node_modules
    environment:
      CI: "true"
      E2E_EXTERNAL_STACK: "1"
      E2E_CAPTURE_OPENAPI: ${E2E_CAPTURE_OPENAPI:-0}
      E2E_FRONTEND_URL: http://frontend:5173
      E2E_BACKEND_URL: http://backend:5000
      E2E_BACKEND_PEER_URL: http://backend-peer:5000
      E2E_SYSTEM_ADMIN_USERNAME: ${E2E_SYSTEM_ADMIN_USERNAME:?set E2E_SYSTEM_ADMIN_USERNAME}
      E2E_SYSTEM_ADMIN_PASSWORD: ${E2E_SYSTEM_ADMIN_PASSWORD:?set E2E_SYSTEM_ADMIN_PASSWORD}
      E2E_OWNER_USERNAME: ${E2E_OWNER_USERNAME:?set E2E_OWNER_USERNAME}
      E2E_OWNER_PASSWORD: ${E2E_OWNER_PASSWORD:?set E2E_OWNER_PASSWORD}
      E2E_WORKSPACE_ADMIN_USERNAME: ${E2E_WORKSPACE_ADMIN_USERNAME:?set E2E_WORKSPACE_ADMIN_USERNAME}
      E2E_WORKSPACE_ADMIN_PASSWORD: ${E2E_WORKSPACE_ADMIN_PASSWORD:?set E2E_WORKSPACE_ADMIN_PASSWORD}
      E2E_LABEL_AUDITOR_USERNAME: ${E2E_LABEL_AUDITOR_USERNAME:?set E2E_LABEL_AUDITOR_USERNAME}
      E2E_LABEL_AUDITOR_PASSWORD: ${E2E_LABEL_AUDITOR_PASSWORD:?set E2E_LABEL_AUDITOR_PASSWORD}
      E2E_FRAME_AUDITOR_USERNAME: ${E2E_FRAME_AUDITOR_USERNAME:?set E2E_FRAME_AUDITOR_USERNAME}
      E2E_FRAME_AUDITOR_PASSWORD: ${E2E_FRAME_AUDITOR_PASSWORD:?set E2E_FRAME_AUDITOR_PASSWORD}
      E2E_VIEWER_USERNAME: ${E2E_VIEWER_USERNAME:?set E2E_VIEWER_USERNAME}
      E2E_VIEWER_PASSWORD: ${E2E_VIEWER_PASSWORD:?set E2E_VIEWER_PASSWORD}
    depends_on:
      frontend-ready:
        condition: service_completed_successfully
      app-bootstrap:
        condition: service_completed_successfully
      backend-peer-ready:
        condition: service_completed_successfully

volumes:
  postgres-data:
  frontend-node-modules:
  playwright-node-modules:
